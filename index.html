<script>
  // A phone opens the phone version (one student, touch, portrait). ?board keeps the board on any screen.
  (function () {
    try {
      var q = location.search;
      if (/[?&](board|teacher)\b/.test(q)) return;
      var small = Math.min(screen.width, screen.height) < 600, touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      if (small && touch) location.replace('phone.html');
    } catch (e) {}
  })();
</script>
