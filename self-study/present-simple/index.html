<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present Simple Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4dc; --bg2:#ffe3ee; --bg3:#dff0ff;
  --card:#ffffff; --ink:#22223b; --soft:#6b6b85; --line:#ece8f4; --chip:#f3f0ff;
  --ok:#14a35a; --okbg:#e3f8ec; --bad:#e2463c; --badbg:#ffecea;
  --you:#2f6fde; --verb:#14a35a; --aux:#f07a00; --wh:#9b3fd6;
  --shadow:0 10px 30px rgba(90,60,170,.10);
  --pc:#ff6b6b; --pc2:#ff9f43;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1a1730; --bg2:#22183a; --bg3:#13243a;
    --card:#232241; --ink:#f1f0fa; --soft:#b0aecb; --line:#36345a; --chip:#2e2c55;
    --ok:#4fd88d; --okbg:#173a2a; --bad:#ff7b72; --badbg:#41201f;
    --you:#7fa8ff; --verb:#4fd88d; --aux:#ffad5c; --wh:#cf8cff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#1a1730; --bg2:#22183a; --bg3:#13243a;
  --card:#232241; --ink:#f1f0fa; --soft:#b0aecb; --line:#36345a; --chip:#2e2c55;
  --ok:#4fd88d; --okbg:#173a2a; --bad:#ff7b72; --badbg:#41201f;
  --you:#7fa8ff; --verb:#4fd88d; --aux:#ffad5c; --wh:#cf8cff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:18px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg1);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%) fixed}
main{max-width:680px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:1.7rem;margin:.2em 0 .3em;line-height:1.2;font-weight:900}
h2{font-size:1.35rem;margin:.1em 0 .5em;line-height:1.25;font-weight:900}
p{margin:.5em 0}
b{font-weight:800}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 4px}
.logo{font-weight:900;font-size:1.05rem;letter-spacing:.01em;background:linear-gradient(90deg,#ff6b6b,#ff9f43,#9b3fd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.langs{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.langs button{border:none;background:none;color:var(--soft);font:800 .85rem "Nunito",sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.langs button.on{background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff}

.card{background:var(--card);border-radius:22px;padding:22px 20px;margin:14px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.part{border-top:6px solid var(--pc)}
.top{display:flex;align-items:center;gap:12px;font-size:.85rem;font-weight:800;color:var(--soft);margin-top:6px}
.bar{flex:1;height:12px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#ff9f43,#ffd93d,#38d39f,#4d96ff,#9b3fd6);border-radius:12px;transition:width .4s}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:900;color:#fff;background:var(--pc);padding:4px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}

button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;transition:transform .12s,box-shadow .12s,border-color .12s}
button.main{background:linear-gradient(135deg,var(--pc),var(--pc2));border:none;color:#fff;font-weight:900;width:100%;margin-top:16px;padding:15px 18px;font-size:1.05rem;box-shadow:0 6px 16px rgba(0,0,0,.12)}
button.main:hover:not(:disabled){transform:translateY(-2px)}
button.ghost{background:var(--card);color:var(--pc);border:2px solid var(--pc);box-shadow:none}
button.link{border:none;background:none;color:var(--pc);padding:8px 0 0;text-decoration:underline;font-weight:800}
button:disabled{opacity:.55;cursor:default}

.opts{display:grid;gap:10px;margin-top:16px}
.opts button{text-align:left;font-size:1.08rem;font-weight:700;padding:14px 16px}
.opts button:hover:not(:disabled){border-color:var(--pc);transform:translateX(3px)}
.opts button.ok{background:var(--okbg);border-color:var(--ok);opacity:1;animation:pop .35s}
.opts button.bad{background:var(--badbg);border-color:var(--bad);opacity:1;animation:shake .35s}
.opts button.ok::after{content:" ✔";color:var(--ok)}
.opts button.bad::after{content:" ✘";color:var(--bad)}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.q{font-size:1.35rem;font-weight:800;margin-top:14px}
.blank{display:inline-block;min-width:76px;border-bottom:3px solid var(--pc);text-align:center;padding:0 4px}
.blank.filled{border-color:var(--ok);color:var(--ok)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1rem}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb .big{font-size:1.15rem;font-weight:900}

.rule{border-collapse:collapse;width:100%;margin:10px 0;font-size:1.02rem}
.rule td{padding:7px 8px;border-bottom:2px dashed var(--line);vertical-align:top}
.rule td:first-child{white-space:nowrap}
.ex{background:var(--chip);border-radius:14px;padding:12px 14px;margin:10px 0}
.ex div{margin:3px 0}
.y{color:var(--you);font-weight:800}.v{color:var(--verb);font-weight:800}.a{color:var(--aux);font-weight:900}.w{color:var(--wh);font-weight:900}
.no{color:var(--bad);text-decoration:line-through}
.note{font-size:.93rem;color:var(--soft)}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0;font-weight:800}
.formula span{padding:7px 12px;border-radius:12px;background:var(--chip)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:52px}
.chips button{padding:10px 15px;background:var(--chip);border-color:transparent;font-weight:800}
.chips button:hover{border-color:var(--pc)}
.answer{min-height:60px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.answer button{padding:10px 15px;border-color:var(--pc);font-weight:800}
.answer.ok{border-color:var(--ok);background:var(--okbg)}
.answer.bad{border-color:var(--bad);background:var(--badbg)}
.answer .ph{color:var(--soft);font-size:.95rem;padding:0 6px}
.rulebox{margin-top:10px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:.95rem}

.hero{text-align:center;padding:26px 20px}
.hero .big{font-size:3rem;line-height:1}
.hero h1{font-size:1.9rem}
.hero h1 span{background:linear-gradient(90deg,#ff6b6b,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.parts{display:grid;gap:10px;margin:16px 0 4px;text-align:left}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--chip);font-weight:800}
.prow .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;color:#fff}
.prow .t{flex:1}
.prow .m{font-size:.85rem;color:var(--soft);white-space:nowrap}
.pickl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.pickl button{font-weight:800;padding:10px 16px;border-radius:999px}
.pickl button.on{border-color:#ff6b6b;background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff}

.score{font-size:3.4rem;font-weight:900;margin:.05em 0;background:linear-gradient(90deg,#ff6b6b,#ff9f43,#9b3fd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.res{width:100%;border-collapse:collapse}
.res td{padding:8px 4px;border-bottom:2px dashed var(--line);font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
.mist{font-size:.95rem;margin:6px 0;padding:8px 12px;background:var(--badbg);border-radius:12px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:200px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
footer{font-size:.88rem;color:var(--soft);text-align:center;margin-top:18px;font-weight:700}
footer a{color:#e8573f}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="hdr"><span class="logo">Present Simple ✦</span><div class="langs" id="langs"></div></div>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>

<script>
/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mc(q,opts,tip){return {t:'mc',q,opts,a:opts[0],tip};}
function ord(words,tip){return {t:'order',words,a:words.join(' ')+'?',tip};}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- language ---------- */
const LANGS=[['en','EN','English'],['ru','RU','Русский'],['uz','UZ',"O'zbekcha"]];
let L=store('ps-lang');
if(!['en','ru','uz'].includes(L)){const n=(navigator.language||'').slice(0,2);L=n==='ru'?'ru':n==='uz'?'uz':'en';}

const UI={
 en:{part:(a,b)=>`Part ${a} of ${b}`, partTag:a=>`Part ${a}`, rule:'Rule', understood:'I understand → Exercises',
  show:'Show the rule', hide:'Hide the rule', tap:'Tap the words to make a question.', check:'Check', yourQ:'Your question…',
  correct:'Correct!', wrong:'Not quite.', answer:'Answer:', next:'Next →', result:'See my result',
  h1:'Present Simple <span>&amp; Question Words</span>', intro1:'For you if you missed the lessons. About <b>15 minutes</b>.',
  intro2:'<b>5 short parts.</b> Each part: a short <b>rule</b> with examples, then a few <b>exercises</b> — just tap the answer.',
  intro3:'When you finish, you can do it all again with <b>new</b> sentences.', min:'min', start:"Let's start!", choose:'Choose your language:',
  done:r=>`Finished! Round ${r}`, m90:'Excellent! You know this well. 🎉', m70:'Good work! Look at your mistakes below, then try again with new sentences.',
  m0:'Good start. Read the rules again and try a new round — practice helps.', mist:'My mistakes', ruleL:'Rule:',
  again:'Do it again?', againP:'Every new round has <b>new sentences</b>.', againA:'New exercises only', againB:'New exercises + rules',
  foot:'Paper version: <a href="print.html">printable worksheet</a> · <a href="worksheet.pdf">PDF</a>',
  CHOOSE_S:'Choose the correct sentence.', CHOOSE_Q:'Choose the correct question.'},
 ru:{part:(a,b)=>`Часть ${a} из ${b}`, partTag:a=>`Часть ${a}`, rule:'Правило', understood:'Понятно → к упражнениям',
  show:'Показать правило', hide:'Скрыть правило', tap:'Нажимайте на слова, чтобы составить вопрос.', check:'Проверить', yourQ:'Ваш вопрос…',
  correct:'Верно!', wrong:'Не совсем.', answer:'Правильный ответ:', next:'Дальше →', result:'Мой результат',
  h1:'Present Simple <span>и вопросительные слова</span>', intro1:'Материал для тех, кто пропустил уроки. Примерно <b>15 минут</b>.',
  intro2:'<b>5 коротких частей.</b> В каждой: короткое <b>правило</b> с примерами, потом несколько <b>упражнений</b> — просто нажмите на ответ.',
  intro3:'В конце можно пройти всё ещё раз с <b>новыми</b> предложениями.', min:'мин', start:'Начать!', choose:'Выберите язык:',
  done:r=>`Готово! Раунд ${r}`, m90:'Отлично! Вы хорошо знаете эту тему. 🎉', m70:'Хорошо! Посмотрите на ошибки ниже и пройдите ещё раз с новыми предложениями.',
  m0:'Хорошее начало. Прочитайте правила ещё раз и пройдите новый раунд — практика помогает.', mist:'Мои ошибки', ruleL:'Правило:',
  again:'Ещё раз?', againP:'В каждом новом раунде — <b>новые предложения</b>.', againA:'Только новые упражнения', againB:'Новые упражнения + правила',
  foot:'Бумажная версия: <a href="print.html">лист для печати</a> · <a href="worksheet.pdf">PDF</a>',
  CHOOSE_S:'Выберите правильное предложение.', CHOOSE_Q:'Выберите правильный вопрос.'},
 uz:{part:(a,b)=>`Qism ${a} / ${b}`, partTag:a=>`${a}-qism`, rule:'Qoida', understood:'Tushundim → mashqlarga',
  show:"Qoidani ko'rsatish", hide:'Qoidani yashirish', tap:"So'zlarni bosib, savol tuzing.", check:'Tekshirish', yourQ:'Savolingiz…',
  correct:"To'g'ri!", wrong:'Unchalik emas.', answer:"To'g'ri javob:", next:'Keyingi →', result:'Natijam',
  h1:"Present Simple <span>va so'roq so'zlari</span>", intro1:"Darslarni o'tkazib yuborganlar uchun. Taxminan <b>15 daqiqa</b>.",
  intro2:"<b>5 ta qisqa qism.</b> Har birida: misollar bilan qisqa <b>qoida</b>, keyin bir nechta <b>mashq</b> — javobni bosing.",
  intro3:"Oxirida hammasini <b>yangi</b> gaplar bilan qaytadan bajarishingiz mumkin.", min:'daq', start:'Boshladik!', choose:'Tilni tanlang:',
  done:r=>`Tayyor! ${r}-raund`, m90:"A'lo! Siz bu mavzuni yaxshi bilasiz. 🎉", m70:"Yaxshi! Quyidagi xatolarni ko'rib chiqing va yangi gaplar bilan qayta urinib ko'ring.",
  m0:"Yaxshi boshlanish. Qoidalarni yana o'qing va yangi raundni boshlang — mashq yordam beradi.", mist:'Xatolarim', ruleL:'Qoida:',
  again:'Yana bir bor?', againP:'Har bir yangi raundda <b>yangi gaplar</b>.', againA:'Faqat yangi mashqlar', againB:'Yangi mashqlar + qoidalar',
  foot:"Qog'oz versiyasi: <a href=\"print.html\">chop etish uchun varaq</a> · <a href=\"worksheet.pdf\">PDF</a>",
  CHOOSE_S:"To'g'ri gapni tanlang.", CHOOSE_Q:"To'g'ri savolni tanlang."}
};
// words used inside the short tips
const TIP={
 en:{S:'add -s',NOS:'no -s',V:'verb',VNOS:'verb (no -s)',has:'has (not haves)',name:'',because:'because…',
  place:'a place',clock:'clock time',person:'a person',age:'age',way:'the way',thing:'a thing',number:'a number',time:'a time',job:'a job',day:'a day'},
 ru:{S:'добавляем -s',NOS:'без -s',V:'глагол',VNOS:'глагол без -s',has:'has (не haves)',name:' — Как вас зовут?',because:'because (потому что)',
  place:'место',clock:'время на часах',person:'человек',age:'возраст',way:'способ',thing:'предмет, вещь',number:'число',time:'время',job:'профессия',day:'день'},
 uz:{S:"-s qo'shamiz",NOS:"-s qo'shilmaydi",V:"fe'l",VNOS:"fe'l (-s siz)",has:'has (haves emas)',name:' — Ismingiz nima?',because:'because (chunki)',
  place:'joy',clock:'soat',person:'odam',age:'yosh',way:'usul',thing:'narsa',number:'son',time:'vaqt',job:'kasb',day:'kun'}
};
function tr(s){return s.replace(/\{(\w+)\}/g,(m,k)=>typeof UI[L][k]==='string'?UI[L][k]:(TIP[L][k]!==undefined?TIP[L][k]:m));}
function t(k){return UI[L][k];}
function loc(o){return typeof o==='string'?o:(o[L]||o.en);}

/* ---------- content ---------- */
const PARTS=[
{
 id:'pos', icon:'👤', pc:'#ff6b6b', pc2:'#ff9f43', min:3,
 title:{en:'He works, she works',ru:'He works, she works',uz:'He works, she works'},
 rule:{
 en:`
  <p>We use the Present Simple for things that are <b>always true</b> and for <b>habits</b> (every day, on Mondays, usually).</p>
  <table class="rule">
   <tr><td><span class="y">I / you / we / they</span></td><td><span class="v">work</span></td></tr>
   <tr><td><span class="y">he / she / it</span></td><td><span class="v">work<u>s</u></span> &nbsp;← add <b>-s</b></td></tr>
  </table>
  <div class="ex">
   <div><span class="y">I</span> <span class="v">live</span> in a flat.</div>
   <div><span class="y">My brother</span> <span class="v">lives</span> in a house.</div>
  </div>
  <p class="note">my brother = he · my mother = she · the shop = it · my friends = they</p>
  <p><b>Spelling with he / she / it:</b></p>
  <table class="rule">
   <tr><td>watch, wash, go, do</td><td>→ watch<b>es</b>, wash<b>es</b>, go<b>es</b>, do<b>es</b></td></tr>
   <tr><td>study, cry</td><td>→ stud<b>ies</b>, cr<b>ies</b></td></tr>
   <tr><td>play, say</td><td>→ play<b>s</b>, say<b>s</b></td></tr>
   <tr><td>have</td><td>→ <b>has</b> (special!)</td></tr>
  </table>`,
 ru:`
  <p>Present Simple — это настоящее время для того, что <b>всегда правда</b>, и для <b>привычек</b> (every day — каждый день, on Mondays — по понедельникам, usually — обычно).</p>
  <table class="rule">
   <tr><td><span class="y">I / you / we / they</span></td><td><span class="v">work</span></td></tr>
   <tr><td><span class="y">he / she / it</span></td><td><span class="v">work<u>s</u></span> &nbsp;← добавляем <b>-s</b></td></tr>
  </table>
  <div class="ex">
   <div><span class="y">I</span> <span class="v">live</span> in a flat. <span class="note">— Я живу в квартире.</span></div>
   <div><span class="y">My brother</span> <span class="v">lives</span> in a house. <span class="note">— Мой брат живёт в доме.</span></div>
  </div>
  <p class="note">my brother = he · my mother = she · the shop = it · my friends = they</p>
  <p><b>Как пишется с he / she / it:</b></p>
  <table class="rule">
   <tr><td>watch, wash, go, do</td><td>→ watch<b>es</b>, wash<b>es</b>, go<b>es</b>, do<b>es</b></td></tr>
   <tr><td>study, cry</td><td>→ stud<b>ies</b>, cr<b>ies</b></td></tr>
   <tr><td>play, say</td><td>→ play<b>s</b>, say<b>s</b></td></tr>
   <tr><td>have</td><td>→ <b>has</b> (исключение!)</td></tr>
  </table>`,
 uz:`
  <p>Present Simple — <b>har doim to'g'ri</b> bo'lgan narsalar va <b>odatlar</b> uchun ishlatiladi (every day — har kuni, on Mondays — dushanba kunlari, usually — odatda).</p>
  <table class="rule">
   <tr><td><span class="y">I / you / we / they</span></td><td><span class="v">work</span></td></tr>
   <tr><td><span class="y">he / she / it</span></td><td><span class="v">work<u>s</u></span> &nbsp;← <b>-s</b> qo'shamiz</td></tr>
  </table>
  <div class="ex">
   <div><span class="y">I</span> <span class="v">live</span> in a flat. <span class="note">— Men kvartirada yashayman.</span></div>
   <div><span class="y">My brother</span> <span class="v">lives</span> in a house. <span class="note">— Akam uyda yashaydi.</span></div>
  </div>
  <p class="note">my brother = he · my mother = she · the shop = it · my friends = they</p>
  <p><b>he / she / it bilan yozilishi:</b></p>
  <table class="rule">
   <tr><td>watch, wash, go, do</td><td>→ watch<b>es</b>, wash<b>es</b>, go<b>es</b>, do<b>es</b></td></tr>
   <tr><td>study, cry</td><td>→ stud<b>ies</b>, cr<b>ies</b></td></tr>
   <tr><td>play, say</td><td>→ play<b>s</b>, say<b>s</b></td></tr>
   <tr><td>have</td><td>→ <b>has</b> (istisno!)</td></tr>
  </table>`},
 ruleShort:`<span class="y">I / you / we / they</span> <span class="v">work</span> · <span class="y">he / she / it</span> <span class="v">works</span> · go→goes, watch→watches, study→studies, have→has`,
 n:6,
 pool:[
  mc('My brother ___ in a hospital.',['works','work'],'my brother = he → {S}'),
  mc('I ___ coffee every morning.',['drink','drinks'],'I → {NOS}'),
  mc('We ___ in a small flat.',['live','lives'],'we → {NOS}'),

  ord(['How many','languages','do','you','speak'],'How many languages + do + you + speak'),
  ord(['What','does','your husband','cook'],'What + does + your husband + cook'),
  ord(['When','does','the shop','open'],'When + does + the shop + open'),
  ord(['What time','do','you','get up'],'What time + do + you + get up'),
  ord(['Where','do','your parents','live'],'Where + do + your parents + live'),
 ]
}
];

/* ---------- no-repeat picking (remembers across rounds) ---------- */
let used={};
try{used=JSON.parse(store('ps-used')||'{}')||{};}catch(e){used={};}
function pick(part){
  const all=part.pool.map((_,i)=>i);
  let seen=(used[part.id]||[]).filter(i=>i<part.pool.length);
  let fresh=all.filter(i=>!seen.includes(i));
  let chosen;
  if(fresh.length>=part.n){chosen=shuffle(fresh).slice(0,part.n);used[part.id]=seen.concat(chosen);}
  else{chosen=shuffle(fresh).concat(shuffle(seen.slice(0,seen.length-part.n))).slice(0,part.n);used[part.id]=chosen.slice();}
  return chosen.map(i=>part.pool[i]);
}

/* ---------- state ---------- */
const app=document.getElementById('app');
let S=null;

function newRound(showRules){
  const round=S?S.round+1:1;
  const steps=[];
  PARTS.forEach((p,pi)=>{
    if(showRules) steps.push({k:'rule',p:pi});
    pick(p).forEach(item=>steps.push({k:'q',p:pi,item}));
  });
  store('ps-used',JSON.stringify(used));
  S={round,steps,i:0,results:PARTS.map(()=>({ok:0,n:0,miss:[]}))};
  render(true);
}

function setLang(l){
  L=l;store('ps-lang',l);document.documentElement.lang=l;
  drawLangs();render(false);
}
function drawLangs(){
  const box=document.getElementById('langs');
  box.innerHTML=LANGS.map(([c,s])=>`<button data-l="${c}" class="${c===L?'on':''}">${s}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  document.getElementById('foot').innerHTML=t('foot');
}

function setPart(p){
  document.documentElement.style.setProperty('--pc',p.pc);
  document.documentElement.style.setProperty('--pc2',p.pc2);
}

function progress(){
  const pct=Math.round(S.i/S.steps.length*100);
  return `<div class="top"><span>${t('part')(S.steps[S.i].p+1,PARTS.length)}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>`;
}

function render(scroll){
  if(scroll!==false) window.scrollTo(0,0);
  if(!S) return renderStart();
  if(S.i>=S.steps.length) return renderEnd();
  const st=S.steps[S.i];
  setPart(PARTS[st.p]);
  if(st.k==='rule') return renderRule(st);
  if(st.item.t==='mc') return renderMC(st);
  return renderOrder(st);
}

function renderStart(){
  setPart(PARTS[0]);
  app.innerHTML=`
  <div class="card hero">
    <div class="big">📚✨</div>
    <h1>${t('h1')}</h1>
    <p class="note">${t('choose')}</p>
    <div class="pickl">${LANGS.map(([c,,n])=>`<button data-l="${c}" class="${c===L?'on':''}">${n}</button>`).join('')}</div>
    <p>${t('intro1')}</p>
    <p>${t('intro2')}</p>
    <div class="parts">${PARTS.map((p,i)=>`<div class="prow"><span class="ic" style="background:linear-gradient(135deg,${p.pc},${p.pc2})">${p.icon}</span><span class="t">${i+1}. ${loc(p.title)}</span><span class="m">~${p.min} ${t('min')}</span></div>`).join('')}</div>
    <p class="note">${t('intro3')}</p>
    <button class="main" id="go">${t('start')} 🚀</button>
  </div>`;
  app.querySelectorAll('.pickl button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  document.getElementById('go').onclick=()=>newRound(true);
}

function renderRule(st){
  const p=PARTS[st.p];
  app.innerHTML=`${progress()}
  <div class="card part">
    <span class="tag">${p.icon} ${t('partTag')(st.p+1)} · ${t('rule')}</span>
    <h2 style="margin-top:12px">${loc(p.title)}</h2>
    ${loc(p.rule)}
    <button class="main" id="next">${t('understood')}</button>
  </div>`;
  document.getElementById('next').onclick=next;
}

function head(st){
  const p=PARTS[st.p];
  const qs=S.steps.filter(s=>s.k==='q'&&s.p===st.p);
  return `<span class="tag">${p.icon} ${t('partTag')(st.p+1)} · ${qs.indexOf(st)+1}/${qs.length}</span>`;
}
function ruleToggle(st){
  const open=!!st.ruleOpen;
  return `<button class="link" id="rt">${open?t('hide'):t('show')}</button><div class="rulebox" id="rb" ${open?'':'hidden'}>${loc(PARTS[st.p].ruleShort)}</div>`;
}
function wireRuleToggle(st){
  const b=document.getElementById('rt'),box=document.getElementById('rb');
  b.onclick=()=>{st.ruleOpen=box.hidden;box.hidden=!box.hidden;b.textContent=box.hidden?t('show'):t('hide');};
}

function renderMC(st){
  const it=st.item;
  if(!st.order) st.order=shuffle(it.opts);
  const q=tr(it.q), hasBlank=q.includes('___');
  const qHtml=esc(q).replace('___',`<span class="blank${st.choice?' filled':''}" id="blank">${st.choice?esc(it.a):'&nbsp;'}</span>`);
  app.innerHTML=`${progress()}
  <div class="card part">
    ${head(st)}
    <p class="q">${qHtml}</p>
    <div class="opts">${st.order.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    ${ruleToggle(st)}
  </div>`;
  wireRuleToggle(st);
  const btns=[...app.querySelectorAll('.opts button')];
  function showAnswered(){
    btns.forEach(x=>{x.disabled=true;if(x.dataset.o===it.a)x.classList.add('ok');if(x.dataset.o===st.choice&&st.choice!==it.a)x.classList.add('bad');});
    feedback(st.choice===it.a,it);
  }
  if(st.choice) return showAnswered();
  btns.forEach(b=>b.onclick=()=>{
    st.choice=b.dataset.o;const ok=st.choice===it.a;
    const bl=document.getElementById('blank');if(bl){bl.textContent=it.a;bl.classList.add('filled');}
    record(st,ok,ok?'':hasBlank?it.q.replace('___','['+st.choice+']')+' → '+it.q.replace('___',it.a):st.choice+' → '+it.a);
    showAnswered();
  });
}

function renderOrder(st){
  const it=st.item;
  if(!st.bank){
    st.bank=shuffle(it.words.map((w,i)=>({w,i})));
    if(st.bank.map(x=>x.w).join(' ')===it.words.join(' ')) st.bank.push(st.bank.shift());
    st.picked=[];
  }
  app.innerHTML=`${progress()}
  <div class="card part">
    ${head(st)}
    <p class="q">${t('tap')}</p>
    <div class="answer" id="ans"></div>
    <div class="chips" id="bank"></div>
    <button class="main" id="check" disabled>${t('check')}</button>
    <div id="fb"></div>
    ${ruleToggle(st)}
  </div>`;
  wireRuleToggle(st);
  const ans=document.getElementById('ans'),bk=document.getElementById('bank'),ck=document.getElementById('check');
  function draw(){
    ans.innerHTML=st.picked.length?'':`<span class="ph">${t('yourQ')}</span>`;
    st.picked.forEach((x,k)=>{const b=el(`<button>${esc(x.w)}</button>`);b.onclick=()=>{if(st.done)return;st.picked.splice(k,1);st.bank.push(x);draw();};ans.appendChild(b);});
    if(st.picked.length) ans.appendChild(el('<span><b>?</b></span>'));
    bk.innerHTML='';
    st.bank.forEach((x,k)=>{const b=el(`<button>${esc(x.w)}</button>`);b.onclick=()=>{if(st.done)return;st.bank.splice(k,1);st.picked.push(x);draw();};bk.appendChild(b);});
    ck.disabled=st.bank.length>0||st.done;
  }
  function showDone(){ck.hidden=true;ans.classList.add(st.ok?'ok':'bad');feedback(st.ok,it);}
  draw();
  if(st.done) return showDone();
  ck.onclick=()=>{
    st.done=true;
    const mine=st.picked.map(x=>x.w).join(' ')+'?';
    st.ok=mine===it.a;
    record(st,st.ok,st.ok?'':mine+' → '+it.a);
    draw();showDone();
  };
}

function record(st,ok,miss){const r=S.results[st.p];r.n++;if(ok)r.ok++;else r.miss.push(miss);}

function feedback(ok,it){
  const fb=document.getElementById('fb');
  const last=S.i===S.steps.length-1;
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?`<span class="big">🎉 ${t('correct')}</span>`:`<span class="big">${t('wrong')}</span> ${t('answer')} <b>${esc(it.a)}</b>`}<br><span class="note">${esc(tr(it.tip))}</span></div>
  <button class="main" id="next">${last?t('result'):t('next')}</button>`;
  document.getElementById('next').onclick=next;
}

function next(){S.i++;render(true);}

function confetti(card){
  const box=el('<div class="confetti"></div>');
  const cols=['#ff6b6b','#ff9f43','#ffd93d','#38d39f','#4d96ff','#9b3fd6'];
  for(let i=0;i<40;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];c.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(c);}
  card.appendChild(box);
}

function renderEnd(){
  setPart(PARTS[0]);
  const tot=S.results.reduce((a,r)=>a+r.ok,0), n=S.results.reduce((a,r)=>a+r.n,0);
  const pct=Math.round(tot/n*100);
  const msg=pct>=90?t('m90'):pct>=70?t('m70'):t('m0');
  const weak=S.results.map((r,i)=>({r,i})).filter(x=>x.r.ok<x.r.n);
  app.innerHTML=`
  <div class="card hero" id="endcard">
    <div class="big">${pct>=90?'🏆':pct>=70?'⭐':'💪'}</div>
    <h1>${t('done')(S.round)}</h1>
    <div class="score">${tot} / ${n}</div>
    <p>${msg}</p>
    <table class="res">${S.results.map((r,i)=>`<tr><td style="text-align:left"><span class="dot" style="background:${PARTS[i].pc}"></span>${i+1}. ${loc(PARTS[i].title)}</td><td style="text-align:right">${r.ok}/${r.n} ${r.ok===r.n?'✔':''}</td></tr>`).join('')}</table>
  </div>
  ${weak.length?`<div class="card"><h2>${t('mist')}</h2>${weak.map(x=>`<p><span class="tag" style="background:${PARTS[x.i].pc}">${PARTS[x.i].icon} ${loc(PARTS[x.i].title)}</span></p>${x.r.miss.map(m=>`<div class="mist">${esc(m)}</div>`).join('')}<p class="note">${t('ruleL')} ${loc(PARTS[x.i].ruleShort)}</p>`).join('')}</div>`:''}
  <div class="card">
    <h2>${t('again')} 🔁</h2>
    <p>${t('againP')}</p>
    <div class="row">
      <button class="main" id="again">${t('againA')}</button>
      <button class="main ghost" id="againR">${t('againB')}</button>
    </div>
  </div>`;
  if(pct>=70 && !S.celebrated){S.celebrated=true;confetti(document.getElementById('endcard'));}
  document.getElementById('again').onclick=()=>newRound(false);
  document.getElementById('againR').onclick=()=>newRound(true);
}

document.documentElement.lang=L;
drawLangs();
render(true);
</script>
</body>
</html>
