<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present Simple: самоподготовка</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --soft:#5d6470; --line:#e2ded6;
  --accent:#2f6fde; --ok:#1f8a4c; --okbg:#e5f5ea; --bad:#c23b32; --badbg:#fbe9e7;
  --you:#2f6fde; --verb:#1f8a4c; --aux:#d26a00; --wh:#8a3ec2; --chip:#eef2fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#20242a; --ink:#ecedef; --soft:#a3a9b3; --line:#343941;
    --accent:#6c9cff; --ok:#4fc77f; --okbg:#173525; --bad:#ff7a70; --badbg:#3c1f1d;
    --you:#7aa7ff; --verb:#5ad08b; --aux:#ffa24a; --wh:#c58cf0; --chip:#2a3140;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0 .3em;line-height:1.2}
h2{font-size:1.3rem;margin:0 0 .5em;line-height:1.25}
p{margin:.5em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.top{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--soft)}
.bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;width:100%;margin-top:14px}
button.link{border:none;background:none;color:var(--accent);padding:6px 0;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:10px;margin-top:14px}
.opts button{text-align:left;font-size:1.05rem}
.opts button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opts button.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.q{font-size:1.25rem;font-weight:500}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--soft);text-align:center;padding:0 4px}
.blank.filled{border-color:var(--ok);color:var(--ok);font-weight:600}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:1rem}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:4px solid var(--bad)}
.rule{border-collapse:collapse;width:100%;margin:10px 0;font-size:1.05rem}
.rule td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ex{background:var(--chip);border-radius:10px;padding:10px 14px;margin:10px 0}
.ex div{margin:2px 0}
.y{color:var(--you);font-weight:600}.v{color:var(--verb);font-weight:600}.a{color:var(--aux);font-weight:700}.w{color:var(--wh);font-weight:700}
.no{color:var(--bad);text-decoration:line-through}
.note{font-size:.95rem;color:var(--soft)}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:600}
.formula span{padding:6px 10px;border-radius:8px;background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:52px}
.chips button{padding:10px 14px;background:var(--chip);border-color:transparent;font-weight:500}
.answer{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.answer button{padding:10px 14px;background:var(--card)}
.answer .ph{color:var(--soft);font-size:.95rem;padding:0 6px}
.rulebox{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:.95rem}
.score{font-size:2.6rem;font-weight:700;margin:.1em 0}
.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
.res{width:100%;border-collapse:collapse}
.mist{font-size:.95rem;margin:6px 0;padding:8px 10px;background:var(--badbg);border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:200px}
footer{font-size:.85rem;color:var(--soft);text-align:center;margin-top:20px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<footer>Бумажная версия: <a href="print.html">лист для печати</a> · <a href="worksheet.pdf">PDF</a></footer>

<script>
/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// multiple choice item: first option in list = correct
function mc(q,opts,tip){return {t:'mc',q,opts,a:opts[0],tip};}
function ord(words,tip){return {t:'order',words,a:words.join(' ')+'?',tip};}

/* ---------- content ---------- */
const CHOOSE_S='Выберите правильное предложение.';

/* ---------- no-repeat picking (remembers across rounds) ---------- */
let used={};
try{used=JSON.parse(localStorage.getItem('ps-used')||'{}')||{};}catch(e){used={};}
function saveUsed(){try{localStorage.setItem('ps-used',JSON.stringify(used));}catch(e){}}
function pick(part){
  const all=part.pool.map((_,i)=>i);
  let seen=(used[part.id]||[]).filter(i=>i<part.pool.length);
  let fresh=all.filter(i=>!seen.includes(i));
  let chosen;
  if(fresh.length>=part.n){chosen=shuffle(fresh).slice(0,part.n);used[part.id]=seen.concat(chosen);}
  else{ // pool used up: take what is left, then fill with older ones
    chosen=shuffle(fresh).concat(shuffle(seen.slice(0,seen.length-part.n))).slice(0,part.n);
    used[part.id]=chosen.slice();
  }
  return chosen.map(i=>part.pool[i]);
}

/* ---------- state ---------- */
const app=document.getElementById('app');
let S; // {round, showRules, steps, i, results}

function newRound(showRules){
  const round=S?S.round+1:1;
  const steps=[];
  PARTS.forEach((p,pi)=>{
    if(showRules) steps.push({k:'rule',p:pi});
    pick(p).forEach(item=>steps.push({k:'q',p:pi,item}));
  });
  saveUsed();
  S={round,showRules,steps,i:0,results:PARTS.map(()=>({ok:0,n:0,miss:[]}))};
  render();
}

function progress(){
  const pct=Math.round(S.i/S.steps.length*100);
  const p=PARTS[S.steps[S.i].p];
  return `<div class="top"><span>Часть ${S.steps[S.i].p+1} из ${PARTS.length}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>`;
}

function render(){
  window.scrollTo(0,0);
  if(!S) return renderStart();
  if(S.i>=S.steps.length) return renderEnd();
  const st=S.steps[S.i];
  if(st.k==='rule') return renderRule(st);
  if(st.item.t==='mc') return renderMC(st);
  return renderOrder(st);
}

function renderStart(){
  app.innerHTML=`
  <h1>Present Simple и вопросительные слова</h1>
  <div class="card">
    <p>Материал для тех, кто пропустил уроки. Примерно <b>15 минут</b>.</p>
    <p>Здесь <b>5 коротких частей</b>. В каждой части:</p>
    <p>1. короткое <b>правило</b> с примерами (прочитайте),<br>2. несколько <b>упражнений</b> (нажмите на ответ).</p>
    <table class="rule">${PARTS.map((p,i)=>`<tr><td>${i+1}.</td><td>${p.title}</td><td class="note">~${p.min} мин</td></tr>`).join('')}</table>
    <p class="note">В конце можно пройти всё ещё раз с <b>новыми</b> предложениями.</p>
    <button class="main" id="go">Начать</button>
  </div>`;
  document.getElementById('go').onclick=()=>newRound(true);
}

function renderRule(st){
  const p=PARTS[st.p];
  app.innerHTML=`${progress()}
  <div class="card">
    <span class="tag">Часть ${st.p+1} · Правило</span>
    <h2>${p.title}</h2>
    ${p.rule}
    <button class="main" id="next">Понятно → к упражнениям</button>
  </div>`;
  document.getElementById('next').onclick=next;
}

function head(st){
  const p=PARTS[st.p];
  const qs=S.steps.filter(s=>s.k==='q'&&s.p===st.p);
  const n=qs.indexOf(st)+1;
  return `<span class="tag">Часть ${st.p+1} · ${esc(p.title)} · ${n}/${qs.length}</span>`;
}
function ruleToggle(st){
  return `<button class="link" id="rt">Показать правило</button><div class="rulebox" id="rb" hidden>${PARTS[st.p].ruleShort}</div>`;
}
function wireRuleToggle(){
  const b=document.getElementById('rt'),box=document.getElementById('rb');
  b.onclick=()=>{box.hidden=!box.hidden;b.textContent=box.hidden?'Показать правило':'Скрыть правило';};
}

function renderMC(st){
  const it=st.item;
  const hasBlank=it.q.includes('___');
  const qHtml=esc(it.q).replace('___','<span class="blank" id="blank">&nbsp;</span>');
  app.innerHTML=`${progress()}
  <div class="card">
    ${head(st)}
    <p class="q">${qHtml}</p>
    <div class="opts">${shuffle(it.opts).map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    ${ruleToggle(st)}
  </div>`;
  wireRuleToggle();
  app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
    const choice=b.dataset.o, ok=choice===it.a;
    app.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.o===it.a)x.classList.add('ok');});
    if(!ok)b.classList.add('bad');
    if(hasBlank){const bl=document.getElementById('blank');bl.textContent=it.a;bl.classList.add('filled');}
    record(st,ok,ok?'':hasBlank?it.q.replace('___','['+choice+']')+' → '+it.q.replace('___',it.a):choice+' → '+it.a);
    feedback(ok,it);
  });
}

function renderOrder(st){
  const it=st.item;
  let bank=shuffle(it.words.map((w,i)=>({w,i})));
  // make sure the start order isn't already correct
  if(bank.map(x=>x.w).join(' ')===it.words.join(' ')) bank.push(bank.shift());
  const picked=[];
  app.innerHTML=`${progress()}
  <div class="card">
    ${head(st)}
    <p class="q">Нажимайте на слова, чтобы составить вопрос.</p>
    <div class="answer" id="ans"></div>
    <div class="chips" id="bank"></div>
    <button class="main" id="check" disabled>Проверить</button>
    <div id="fb"></div>
    ${ruleToggle(st)}
  </div>`;
  wireRuleToggle();
  const ans=document.getElementById('ans'),bk=document.getElementById('bank'),ck=document.getElementById('check');
  let locked=false;
  function draw(){
    ans.innerHTML=picked.length?'':'<span class="ph">Ваш вопрос…</span>';
    picked.forEach((x,k)=>{const b=el(`<button>${esc(x.w)}</button>`);b.onclick=()=>{if(locked)return;picked.splice(k,1);bank.push(x);draw();};ans.appendChild(b);});
    if(picked.length) ans.appendChild(el('<span><b>?</b></span>'));
    bk.innerHTML='';
    bank.forEach((x,k)=>{const b=el(`<button>${esc(x.w)}</button>`);b.onclick=()=>{if(locked)return;bank.splice(k,1);picked.push(x);draw();};bk.appendChild(b);});
    ck.disabled=bank.length>0||locked;
  }
  draw();
  ck.onclick=()=>{
    locked=true;ck.disabled=true;ck.hidden=true;
    const mine=picked.map(x=>x.w).join(' ')+'?';
    const ok=mine===it.a;
    record(st,ok,ok?'':mine+' → '+it.a);
    feedback(ok,it);
  };
}

function record(st,ok,miss){
  const r=S.results[st.p];r.n++;if(ok)r.ok++;else r.miss.push(miss);
}

function feedback(ok,it){
  const fb=document.getElementById('fb');
  const last=S.i===S.steps.length-1;
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'<b>Верно!</b>':'<b>Не совсем.</b> Правильный ответ: <b>'+esc(it.a)+'</b>'}<br><span class="note">${esc(it.tip)}</span></div>
  <button class="main" id="next">${last?'Мой результат':'Дальше →'}</button>`;
  const n=document.getElementById('next');n.onclick=next;n.focus();
}

function next(){S.i++;render();}

function renderEnd(){
  const tot=S.results.reduce((a,r)=>a+r.ok,0), n=S.results.reduce((a,r)=>a+r.n,0);
  const pct=Math.round(tot/n*100);
  const msg=pct>=90?'Отлично! Вы хорошо знаете эту тему.':pct>=70?'Хорошо! Посмотрите на ошибки ниже и пройдите ещё раз с новыми предложениями.':'Хорошее начало. Прочитайте правила ещё раз и пройдите новый раунд — практика помогает.';
  const weak=S.results.map((r,i)=>({r,i})).filter(x=>x.r.ok<x.r.n);
  app.innerHTML=`
  <h1>Готово! Раунд ${S.round}</h1>
  <div class="card">
    <div class="score">${tot} / ${n}</div>
    <p>${msg}</p>
    <table class="res">${S.results.map((r,i)=>`<tr><td>${i+1}. ${PARTS[i].title}</td><td style="text-align:right"><b>${r.ok}/${r.n}</b> ${r.ok===r.n?'✔':''}</td></tr>`).join('')}</table>
  </div>
  ${weak.length?`<div class="card"><h2>Мои ошибки</h2>${weak.map(x=>`<p class="tag">${x.i+1}. ${PARTS[x.i].title}</p>${x.r.miss.map(m=>`<div class="mist">${esc(m)}</div>`).join('')}<p class="note">Правило: ${PARTS[x.i].ruleShort}</p>`).join('')}</div>`:''}
  <div class="card">
    <h2>Ещё раз?</h2>
    <p>В каждом новом раунде — <b>новые предложения</b>.</p>
    <div class="row">
      <button class="main" id="again">Только новые упражнения</button>
      <button class="main" id="againR" style="background:var(--card);color:var(--accent)">Новые упражнения + правила</button>
    </div>
  </div>`;
  document.getElementById('again').onclick=()=>newRound(false);
  document.getElementById('againR').onclick=()=>newRound(true);
}

render();
</script>
</body>
</html>
